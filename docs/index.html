<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATUPIA - Stonebreaking Universe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body, html { margin:0; padding:0; height:100%; background:#000; font-family:'Press Start 2P', cursive; overflow:hidden; color:#fff; }
        .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background-size:cover; background-position:center; }
        .screen.active { display:flex; }
        .overlay { position:absolute; inset:0; background:rgba(0,0,0,0.6); z-index:1; }
        .content { position:relative; z-index:10; text-align:center; }
        .logo { max-width:500px; width:80%; margin-bottom:40px; filter:drop-shadow(0 0 20px gold); }
        .btn { background:linear-gradient(#c8102e,#8b0000); color:white; border:4px solid #ffd700; padding:20px 40px; font-size:16px; cursor:pointer; letter-spacing:2px; }
        
        /* Oyun Alanı */
        #game-board { position:relative; width:90vw; height:70vh; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:10px; z-index:20; }
        .tile { width:80px; height:100px; background-size:cover; cursor:pointer; transition: transform 0.2s; border-radius:8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .tile:hover { transform: scale(1.1); filter: brightness(1.2); }
        .tile.selected { border: 3px solid #00ff00; transform: scale(1.05); }
        .tile.cracked { animation: crack 0.3s forwards; pointer-events:none; }
        @keyframes crack { 0% { transform: scale(1); opacity:1; } 100% { transform: scale(0); opacity:0; } }
        
        .hud { position:fixed; top:20px; width:100%; display:flex; justify-content:space-between; padding:0 50px; z-index:30; font-size:12px; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="screen-intro" class="screen active" style="background-image: url('assets/bg.png');">
        <div class="overlay"></div>
        <div class="content">
            <img src="assets/logo.png" class="logo" alt="BATUPIA">
            <button onclick="startGame()" class="btn">MACERAYA BAŞLA</button>
        </div>
    </div>

    <!-- OYUN EKRANI -->
    <div id="screen-game" class="screen" style="background-image: url('assets/bg.png');">
        <div class="hud">
            <div>RUH GÜCÜ: <span id="spirit-bar">0%</span></div>
            <div>MÜHÜR: M-014</div>
        </div>
        <div id="game-board"></div>
    </div>

    <script>
        const types = ['kor', 'baam', 'mand', 'zepy'];
        let selectedTile = null;
        let score = 0;

        function startGame() {
            document.getElementById('screen-intro').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            initBoard();
        }

        function initBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            // 24 taşlık başlangıç seti (Test için)
            let deck = [];
            for(let i=0; i<6; i++) {
                types.forEach(t => deck.push(t));
            }
            deck = deck.sort(() => Math.random() - 0.5);

            deck.forEach((type, index) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.style.backgroundImage = `url('assets/${type}.png')`;
                tile.dataset.type = type;
                tile.onclick = () => handleTileClick(tile);
                board.appendChild(tile);
            });
        }

        function handleTileClick(tile) {
            if(selectedTile === tile) {
                tile.classList.remove('selected');
                selectedTile = null;
                return;
            }

            if(!selectedTile) {
                selectedTile = tile;
                tile.classList.add('selected');
            } else {
                if(selectedTile.dataset.type === tile.dataset.type) {
                    // EŞLEŞME BAŞARILI (STONEBREAKING!)
                    tile.classList.add('cracked');
                    selectedTile.classList.add('cracked');
                    score += 10;
                    document.getElementById('spirit-bar').innerText = (score % 100) + '%';
                    selectedTile = null;
                } else {
                    // HATALI EŞLEŞME
                    selectedTile.classList.remove('selected');
                    selectedTile = tile;
                    tile.classList.add('selected');
                }
            }
        }
    </script>
</body>
</html>
