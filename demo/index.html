<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATUPIA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        body, html { margin:0; padding:0; height:100%; background:#0a0a0a; font-family:'Press Start 2P', system-ui; overflow:hidden; color:#fff; }
        .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; }
        .screen.active { display:flex; }
        .bg { position:absolute; inset:0; background-size:cover; background-position:center; z-index:1; }
        .overlay { position:absolute; inset:0; background:linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.58)); z-index:2; }
        .content { position:relative; z-index:10; text-align:center; padding:20px; }
        .studio-text { color:#ffd700; font-size:13px; letter-spacing:8px; margin-bottom:12px; }
        .logo { max-width:520px; width:82%; margin-bottom:50px; filter:drop-shadow(0 0 28px rgba(255,215,0,0.65)); }
        .btn { background:linear-gradient(#c8102e,#8b0000); color:white; border:5px solid #ffd700; padding:20px 65px; font-size:16px; font-family:'Press Start 2P', system-ui; cursor:pointer; letter-spacing:4px; box-shadow:0 0 25px rgba(255,215,0,0.6); }
        .btn:hover { background:linear-gradient(#ff3b3b,#c8102e); box-shadow:0 0 40px rgba(255,215,0,0.9); transform:translateY(-4px); }
        .logo-cracked { max-width:380px; margin-bottom:25px; animation:crack-appear 1.4s forwards; }
        .necklace { max-width:250px; filter:drop-shadow(0 18px 40px rgba(0,0,0,0.85)); animation:necklace-glow 2.1s infinite alternate; }
        @keyframes crack-appear { 0%{transform:scale(0.5) rotate(-10deg);opacity:0;} 50%{transform:scale(1.15);} 100%{transform:scale(1);opacity:1;} }
        @keyframes necklace-glow { from{filter:drop-shadow(0 18px 40px rgba(255,215,0,0.35));} to{filter:drop-shadow(0 22px 50px rgba(255,215,0,0.85));} }
    </style>
</head>
<body>
    <!-- 1. BATUPIA STUDIO + mobile_scene_v6 + Buton ortada -->
    <div id="screen1" class="screen active">
        <div class="bg" style="background-image: url('assets/mobile_scene_v6.png');"></div>
        <div class="overlay"></div>
        <div class="content">
            <div class="studio-text">BATUPIA STUDIOS</div>
            <img src="assets/logo.png" class="logo" alt="BATUPIA">
            <button onclick="showCracked()" class="btn">MACERAYA BAŞLA</button>
        </div>
    </div>

    <!-- 2. Çatlatılmış logo + altında kolye -->
    <div id="screen2" class="screen">
        <div class="bg" style="background-image: url('assets/mobile_scene_v6.png');"></div>
        <div class="overlay"></div>
        <div class="content">
            <img src="assets/logo_sealed.png" class="logo-cracked" alt="BATUPIA Cracked">
            <img src="assets/kolye.png" class="necklace" alt="Kolye">
        </div>
    </div>

    <script>
        function showCracked() {
            document.getElementById('screen1').classList.remove('active');
            document.getElementById('screen2').classList.add('active');
            console.log("Viral Share: Player started the adventure in BATUPIA!");
        }
        function shareProgress() {
            alert("Tebrikler! BATUPIA Koleksiyon Kartın hazır. Sosyal medyada paylaş!");
        }
    </script>
    <div style="position:fixed; bottom:20px; right:20px; z-index:100;">
        <button onclick="shareProgress()" style="background:#1da1f2; color:white; border:none; padding:10px; border-radius:50%; cursor:pointer; width:50px; height:50px; font-size:20px;">X</button>
    </div>
</body>
</html>
